name: Build image (main)

# Publishes ghcr.io/stalte/plixmetrics:latest on every push to main, so Unraid
# (or any Docker host) can pull the newest build without waiting for a release tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/stalte/plixmetrics:latest
            ghcr.io/stalte/plixmetrics:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
